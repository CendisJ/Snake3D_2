<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Infinite</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130d;color:#fff;font-family:system-ui,Arial;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#10291feF;border:1px solid #65a77a;border-radius:13px;padding:8px 11px;font-weight:800;box-shadow:0 3px 14px #0008}
#controls{position:fixed;right:10px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:100%;z-index:3}
button{border:1px solid #79bd8b;background:#17452d;color:white;border-radius:12px;padding:9px 11px;font-size:13px;font-weight:800;box-shadow:0 3px 10px #0007;touch-action:manipulation}
button:active{transform:scale(.96)}
#help{position:fixed;left:10px;bottom:15px;max-width:42%;background:#10291feF;border:1px solid #47745b;border-radius:12px;padding:8px 10px;font-size:12px;pointer-events:none}
#toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#10291f;border:1px solid #65a77a;border-radius:12px;padding:7px 12px;font-size:12px;display:none;pointer-events:none}
@media(max-width:650px){#controls{left:8px;right:8px;bottom:8px;justify-content:center}button{padding:8px 9px;font-size:12px}#help{bottom:62px;max-width:75%}}

#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#153d29f2,#06110cf5);text-align:center;padding:18px}
.menuCard{width:min(440px,94vw);background:#10291fee;border:1px solid #65a77a;border-radius:24px;padding:24px;box-shadow:0 12px 40px #0009}
.menuTitle{font-size:clamp(34px,8vw,54px);font-weight:1000;letter-spacing:2px;color:#a6ffb5;text-shadow:0 0 18px #2bd866;margin:4px 0 20px}
.menuButtons{display:grid;gap:12px;max-width:260px;margin:18px auto}
.menuButtons button{font-size:18px;padding:13px}
.menuSub{font-size:13px;color:#b9d8c2}
#subpanel{display:none;margin-top:12px}
.skinGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.skinOption{padding:10px 6px;border-radius:12px;background:#0b1c14;border:1px solid #47745b}
.skinDot{display:inline-block;width:19px;height:19px;border-radius:50%;vertical-align:middle;margin-right:6px;border:2px solid #fff8}
#gameHud,#controls,#help{display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu">
 <div class="menuCard">
  <div class="menuTitle">🐍 SNAKE INFINITE</div>
  <div class="menuSub">🍎 Jablicka: <b id="menuCoins">0</b></div>
  <div class="menuButtons" id="mainButtons">
   <button id="playBtn">▶ PLAY</button><button id="skinsBtn">🎨 SKINS</button><button id="settingsBtn">⚙ SETTINGS</button>
  </div>
  <div id="subpanel"></div>
 </div>
</div>

<div id="gameHud"><div id="hud">
 <div class="pill">🐍 Snake Infinite</div>
 <div class="pill">🍎 <span id="score">0</span> &nbsp; 💰 <span id="coins">0</span></div>
</div></div>
<div id="toast"></div>
<div id="help">Tahni prstem nebo mysi a urcuj smer</div>
<div id="controls">
 <button id="speedUp">⚡ Speed 0 . 💰25</button>
 <button id="incomeUp">💵 Income 0 . 💰25</button>
 <button id="pause">⏸ Pauza</button>
 <button id="restart">  Znovu</button>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,D=1,last=0,paused=false,score=0,coins=Number(localStorage.getItem('snakeCoins')||0),speedLevel=0,incomeLevel=0,playing=false;
let selectedSkin=localStorage.getItem('snakeSkin')||'green';
let ownedSkins=JSON.parse(localStorage.getItem('snakeOwned')||'["green"]');
let musicOn=localStorage.getItem('snakeMusic')!=='off',audioCtx=null,musicTimer=null;
let head={x:0,y:0},camera={x:0,y:0},dir={x:1,y:0},wantedDir={x:1,y:0};
let trail=[],foods=[],speed=145;
const radius=12,spacing=13;
const costSpeed=()=>25+speedLevel*30,costIncome=()=>25+incomeLevel*30;
function resize(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function ui(){$('score').textContent=score;$('coins').textContent=Math.floor(coins);$('menuCoins').textContent=Math.floor(coins);localStorage.setItem('snakeCoins',Math.floor(coins));$('speedUp').textContent='⚡ Speed . 💰'+costSpeed();$('incomeUp').textContent='💵 Income . 💰'+costIncome()}
function rand(a,b){return a+Math.random()*(b-a)}
function makeFood(initial=false){
 const r=Math.random();let type,color,points,money,size;
 if(r<.72){type='Spatna';color='#ff4545';points=0;money=0;size=9}
 else if(r<.94){type='Normalni';color='#ffd447';points=1;money=3;size=10}
 else if(r<.99){type='Dobra';color='#54f078';points=3;money=10;size=11}
 else{type='Vzacna';color='#c77aff';points=5;money=20;size=12}
 const rangeX=initial?W*.48:W*1.2,rangeY=initial?H*.38:H*1.2;
 foods.push({x:head.x+rand(-rangeX,rangeX),y:head.y+rand(-rangeY,rangeY),type,color,points,money,size});
}
function reset(){head={x:0,y:0};camera={x:0,y:0};dir={x:1,y:0};wantedDir={x:1,y:0};trail=[];for(let i=0;i<100;i++)trail.push({x:-i*spacing,y:0});foods=[];for(let i=0;i<100;i++)makeFood(true);score=0;speedLevel=0;incomeLevel=0;incomeTimer=0;speed=145;paused=false;$('pause').textContent='⏸ Pauza';ui()}
reset();paused=true;
function aim(x,y){const n=Math.hypot(x,y);if(n>5)wantedDir={x:x/n,y:y/n}}
let dragging=false;
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left-W/2,y:e.clientY-r.top-H/2}}
canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);const p=pointer(e);aim(p.x,p.y)});
canvas.addEventListener('pointermove',e=>{if(dragging){const p=pointer(e);aim(p.x,p.y)}});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
function update(dt){
 if(paused)return;
 // Smoothly turn toward the pointer direction.
 const blend=Math.min(1,dt*7);
 let dx=dir.x+(wantedDir.x-dir.x)*blend,dy=dir.y+(wantedDir.y-dir.y)*blend;
 const n=Math.hypot(dx,dy)||1;dir={x:dx/n,y:dy/n};
 head.x+=dir.x*speed*dt;head.y+=dir.y*speed*dt;camera.x=head.x;camera.y=head.y;
 trail.unshift({x:head.x,y:head.y});
 const length=100+score*3;while(trail.length>length)trail.pop();
 // Penize se ziskavaji pouze sebranim jidla. Income upgrade nasobi odmenu z jidla.
 for(let i=foods.length-1;i>=0;i--){const f=foods[i];if(Math.hypot(head.x-f.x,head.y-f.y)<radius+f.size+15){score=Math.max(0,score+f.points);coins=Math.max(0,coins+Math.round(f.money*(1+incomeLevel*0.5)));foods.splice(i,1);makeFood();ui()}}
 // Snake passes through its own body; there is deliberately no self-collision check.
}
function grid(){const step=70,ox=((camera.x%step)+step)%step,oy=((camera.y%step)+step)%step;ctx.strokeStyle='#244735';ctx.lineWidth=1;ctx.beginPath();for(let x=-ox;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=-oy;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke()}
function screen(p){return{x:W/2+p.x-camera.x,y:H/2+p.y-camera.y}}
function drawFoods(){for(const f of foods){const p=screen(f);if(p.x< -20||p.x>W+20||p.y< -20||p.y>H+20)continue;ctx.save();ctx.shadowColor=f.color;ctx.shadowBlur=18;const g=ctx.createRadialGradient(p.x-f.size*.35,p.y-f.size*.4,1,p.x,p.y,f.size*1.4);g.addColorStop(0,'#fff');g.addColorStop(.3,f.color);g.addColorStop(1,f.color);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,f.size+2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('.',p.x,p.y+3);ctx.restore()}}
function drawSnake(){
 // Draw the body as a continuous thick line so it stays clearly visible.
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 let started=false;
 for(let i=trail.length-1;i>=0;i--){const p=screen(trail[i]);if(p.x< -50||p.x>W+50||p.y< -50||p.y>H+50)continue;if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}
 const skinColors={green:['#178b3d','#62ed83','#9affad'],blue:['#176caa','#65c5ff','#b7e7ff'],gold:['#a87912','#ffd34d','#fff0a8'],purple:['#7135a8','#c77aff','#e9c4ff'],pink:['#a83267','#ff75b5','#ffd0e5']};const sc=skinColors[selectedSkin]||skinColors.green;ctx.strokeStyle=sc[0];ctx.lineWidth=23;ctx.shadowColor='#25ed63';ctx.shadowBlur=8;ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle=sc[1];ctx.lineWidth=17;ctx.stroke();
 const x=W/2,y=H/2;ctx.fillStyle=sc[2];ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
 const px=-dir.y*4,py=dir.x*4;ctx.fillStyle='#07351b';
 for(const s of [-1,1]){ctx.beginPath();ctx.arc(x+dir.x*5+px*s,y+dir.y*5+py*s,2.7,0,Math.PI*2);ctx.fill()}
 ctx.restore()
}
function render(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#07130e');bg.addColorStop(1,'#0c2417');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);grid();drawFoods();drawSnake();if(paused){ctx.fillStyle='#ffffff';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillText('PAUZA',W/2,H/2+65)}}
function loop(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.04);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function showMenu(){playing=false;paused=true;$('menu').style.display='flex';$('gameHud').style.display='none';$('controls').style.display='none';$('help').style.display='none';$('mainButtons').style.display='grid';$('subpanel').style.display='none';ui()}
function startGame(){playing=true;paused=false;$('menu').style.display='none';$('gameHud').style.display='block';$('controls').style.display='flex';$('help').style.display='block';}
function showPanel(kind){
 $('mainButtons').style.display='none';const box=$('subpanel');box.style.display='block';
 if(kind==='skins'){
  c
